[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commercegraph"
version = "0.1.0"
description = "Evidence-based e-commerce graph questions with Gemini"
requires-python = ">=3.12"
dependencies = ["networkx>=3.4", "pydantic>=2.10", "google-genai>=1.0", "python-dotenv>=1.0", "streamlit>=1.50", "plotly>=6.0", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
commercegraph = "commercegraph.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commercegraph = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly enabled real Gemini calls"]

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache", ".uv-clean-cache", ".venv", ".venv-review", "local-logs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
