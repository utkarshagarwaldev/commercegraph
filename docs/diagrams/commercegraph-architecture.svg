<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
<title id="title">CommerceGraph architecture</title>
<desc id="desc">Validated JSON builds a local NetworkX graph. A question passes through Gemini query planning, Python validation and graph retrieval, an evidence bundle, Gemini answer planning, and Python reference validation and factual rendering. The interface presents the answer and supporting evidence.</desc>
